name: Workshop quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workshop-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate workshop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install browser validation dependency
        run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install pinned Agentic Workflows CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh extension install github/gh-aw --pin v0.86.2
      - name: Test repository
        run: npm test
      - name: Validate content and profiles
        run: npm run validate
      - name: Exercise browser journeys
        run: npm run test:browser
      - name: Validate Agentic Workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run validate:workflows
      - name: Verify compiled workflows are current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm run compile:workflows
          git diff --exit-code -- .github/workflows .github/aw platform/templates/station-repository/.github teacher/demos/security-remediation/workflows

  workflow-security:
    name: Audit workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        run: >-
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          .github/workflows/quality.yml
          platform/templates/station-repository/.github/workflows/ci.yml
          teacher/demos/security-remediation/fixture/repository/.github/workflows/quality.yml
          teacher/demos/security-remediation/fixture/repository/.github/workflows/codeql.yml
          teacher/demos/security-remediation/workflows/release.yml
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@6fc4b006235f201fdab3722e17240ab420d580e5 # v0.6.1
        with:
          advanced-security: false
          annotations: true
          inputs: |
           .github/workflows
           platform/templates/station-repository/.github/workflows
          online-audits: false
          persona: auditor
          version: 1.28.0
      - name: Run Poutine
        uses: boostsecurityio/poutine-action@e240ebd3eff8b2db5a8e5f6b28f58739d7db2247 # v1.1.4
        with:
          format: pretty
          output: poutine-results.txt
